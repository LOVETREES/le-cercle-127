[project]
name = "danalyste-127"
version = "0.1.0"
description = "Agent analyste de données du Cercle 127 : rêves, symboles et lectures d'Oni."
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-agents>=1.1.2,<1.2",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mistralai.agents]
entrypoint = "main:agent"
