name: Captures iPhone – accueil et Grimoire
on:
  workflow_dispatch:
  push:
    branches:
      - fix/accueil-grimoire-mobile-captures

permissions:
  contents: write
  actions: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 65
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      LANG: en_US.UTF-8
      HOMEBREW_NO_AUTO_UPDATE: 1
      MAESTRO_CLI_NO_ANALYTICS: 1
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 420000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer Maestro
        run: brew install mobile-dev-inc/tap/maestro
      - uses: actions/download-artifact@v4
        with:
          name: C127-sim-recovery
          run-id: '44961066717'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/c127-cached
      - name: Réutiliser le binaire compilé
        run: |
          tar -xzf "$RUNNER_TEMP/c127-cached/c127-sim-recovery.tar.gz" -C "$RUNNER_TEMP/c127-cached"
          APP="$RUNNER_TEMP/c127-cached/LeCercle127.app"
          test -d "$APP"
          echo "SIMULATOR_APP=$APP" >> "$GITHUB_ENV"
      - name: Démarrer un iPhone 6,9 pouces
        run: |
          DEVICE=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name == "iPhone 17 Pro Max" or .name == "iPhone 16 Pro Max")][0].udid // empty')
          test -n "$DEVICE"
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          open -a Simulator
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance dark
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState discharging --batteryLevel 100
          xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLanguages -array fr
          xcrun simctl spawn "$DEVICE" defaults write NSGlobalDomain AppleLocale -string fr_FR
      - name: Installer l’app sur l’iPhone
        run: |
          xcrun simctl install "$SIMULATOR_ID" "$SIMULATOR_APP"
          xcrun simctl launch "$SIMULATOR_ID" com.lecercle127.app -AppleLanguages '(fr)' -AppleLocale fr_FR
          mkdir -p "$RUNNER_TEMP/c127-captures"
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/c127-captures/initialisation.png"

      - name: Photographier les écrans natifs
        run: |
          mkdir -p "$RUNNER_TEMP/c127-captures"
          cd "$RUNNER_TEMP/c127-captures"
          cat > flow.yml <<'YAML'
          appId: com.lecercle127.app
          ---
          - launchApp:
              arguments:
                AppleLanguages: "(fr)"
                AppleLocale: "fr_FR"
          - tapOn:
              text: "Plus tard"
              optional: true
          - assertVisible: "(?i)(La Lune : .*|La Lune aujourd.hui)"
          - takeScreenshot: 01-accueil-lune
          - scrollUntilVisible:
              element: "Les Sept Sœurs"
              direction: DOWN
              centerElement: true
          - takeScreenshot: 02-sept-soeurs
          - scrollUntilVisible:
              element: "Découvrir ma carte du jour.*"
              direction: DOWN
              centerElement: true
          - tapOn: "Découvrir ma carte du jour.*"
          - takeScreenshot: 03-carte-du-jour
          - scrollUntilVisible:
              element: "Intensité du ressenti"
              direction: DOWN
              centerElement: true
          - takeScreenshot: 04-emotions-naia
          - scrollUntilVisible:
              element: "(?i)Terra : lire les lignes de ma main"
              direction: DOWN
              centerElement: true
          - takeScreenshot: 05-lecture-de-la-main
          - tapOn: "Grimoire"
          - tapOn: "Entrer dans mon Grimoire"
          - scrollUntilVisible:
              element: "Explorer la démonstration locale"
              direction: DOWN
          - tapOn: "Explorer la démonstration locale"
          - scrollUntilVisible:
              element:
                text: "La forêt lumineuse.*"
              direction: DOWN
          - tapOn: "La forêt lumineuse.*"
          - scrollUntilVisible:
              element: "(?i)ce qu.oni y voit"
              direction: DOWN
              centerElement: true
          - takeScreenshot: 06-grimoire-lecture-oni
          YAML
          maestro --device "$SIMULATOR_ID" test flow.yml
          for path in 0*.png; do
            dimensions=$(sips -g pixelWidth -g pixelHeight "$path" | awk '/pixelWidth|pixelHeight/ {print $2}' | paste -sd x -)
            test "$dimensions" = "1320x2868"
          done
          test "$(find . -name '0*.png' | wc -l | tr -d ' ')" = 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Captures-iPhone-6.9
          path: ${{ runner.temp }}/c127-captures/0*.png
          if-no-files-found: warn
      - name: Archiver le binaire si la capture échoue
        if: failure() && env.SIMULATOR_APP != ''
        run: tar -czf "$RUNNER_TEMP/c127-sim-recovery.tar.gz" -C "$(dirname "$SIMULATOR_APP")" "$(basename "$SIMULATOR_APP")"
      - uses: actions/upload-artifact@v4
        if: failure() && env.SIMULATOR_APP != ''
        with:
          name: C127-sim-recovery
          path: ${{ runner.temp }}/c127-sim-recovery.tar.gz
      - name: Enregistrer les captures dans le dossier App Store
        run: |
          git restore eas.json
          mkdir -p store/ios-6.9-accueil-revise
          cp "$RUNNER_TEMP"/c127-captures/0*.png store/ios-6.9-accueil-revise/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add store/ios-6.9-accueil-revise
          git commit -m "Ajoute les captures natives iPhone de l’accueil révisé"
          git push origin HEAD:"$GITHUB_REF_NAME"
