name: Android 1.0.6 – essai photo Terra
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-emulator.yml
permissions:
  contents: read
jobs:
  terra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Récupérer l’APK public 1.0.6
        run: curl --fail --location --retry 3 https://github.com/LOVETREES/le-cercle-127/releases/download/android-v1.0.6/LeCercle127-1.0.6.apk -o /tmp/c127.apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -memory 2048 -cores 2 -skin 720x1280 -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install /tmp/c127.apk
            mkdir -p evidence
            adb logcat -c
            adb logcat > evidence/logcat-live.txt 2>&1 &
            timeout 420 python3 -u scripts/test-terra-emulator.py
      - name: Conserver captures, hiérarchies et diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terra-1.0.6-android35
          path: evidence/
          retention-days: 14
