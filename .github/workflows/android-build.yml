name: Android – APK de test

# Construit l'APK Android (profil « preview ») sur une machine Linux de GitHub, avec la clé de signature
# gardée par Expo. L'APK est joint à l'exécution (onglet Actions > l'exécution > « LeCercle127-apk »).
# L'APK est aussi publié à une adresse fixe, celle du bouton « Télécharger pour Android » du site :
#   https://github.com/LOVETREES/le-cercle-127/releases/download/android-test/LeCercle127.apk
# Déclenchement : bouton « Run workflow » (onglet Actions) ou un envoi dont le message contient [android-build].
on:
  workflow_dispatch:
  push:

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android-build]')
    # File d'attente au niveau du travail : un envoi sans [android-build] (travail sauté) n'y entre pas
    # et ne peut plus annuler une construction en attente.
    concurrency:
      group: android-build
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Écriture du dépôt : seulement pour remplacer l'APK de la publication « android-test ».
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Vérifier le jeton Expo
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Le secret EXPO_TOKEN est absent (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Le SDK Android est déjà installé sur les machines Ubuntu de GitHub.
      - name: SDK Android
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Construire l'APK
        run: npx --yes eas-cli@latest build --platform android --profile preview --local --non-interactive --output "$RUNNER_TEMP/LeCercle127.apk"

      - name: Joindre l'APK à l'exécution
        uses: actions/upload-artifact@v4
        with:
          name: LeCercle127-apk
          path: ${{ runner.temp }}/LeCercle127.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publier l'APK à l'adresse fixe (publication « android-test »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$RUNNER_TEMP/LeCercle127.apk"
          [ -f "$APK" ] || { echo "::error::APK absent"; exit 1; }
          VERSION=$(node -p "require('./app.json').expo.version")
          NOTES="Version de test Android ${VERSION} — construite le $(date -u +%Y-%m-%d) depuis ${GITHUB_SHA::7}. Installer : ouvrir le fichier sur le téléphone et autoriser l'installation."
          if gh release view android-test >/dev/null 2>&1; then
            gh release edit android-test --title "Le Cercle 127 — Android ${VERSION} (test)" --notes "$NOTES" --prerelease
          else
            gh release create android-test --target "$GITHUB_SHA" --title "Le Cercle 127 — Android ${VERSION} (test)" --notes "$NOTES" --prerelease
          fi
          gh release upload android-test "$APK" --clobber
