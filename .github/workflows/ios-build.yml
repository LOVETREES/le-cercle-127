name: iOS – construction et envoi à TestFlight

# Construit l'app iPhone sur un Mac de GitHub (gratuit pour un dépôt public),
# avec les certificats gardés par Expo, puis l'envoie à App Store Connect.
# Déclenchement : bouton « Run workflow » (onglet Actions, une fois sur main)
# ou un envoi dont le message contient [ios-build].
on:
  workflow_dispatch:
  push:

jobs:
  ios:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios-build]')
    # File d'attente au niveau du travail : un envoi sans [ios-build] n'annule plus une construction en attente.
    concurrency:
      group: ios-build
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Vérifier le jeton Expo
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Le secret EXPO_TOKEN est absent (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Choisir le Xcode le plus récent (27 si disponible, comme chez Expo)
        run: |
          for x in /Applications/Xcode*.app; do echo "$x -> $(defaults read "$x/Contents/Info" CFBundleShortVersionString 2>/dev/null)"; done
          X=$(for x in /Applications/Xcode*.app; do v=$(defaults read "$x/Contents/Info" CFBundleShortVersionString 2>/dev/null) && echo "$v $x"; done | sort -V | tail -1 | cut -d' ' -f2-)
          echo "Choisi : $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dépendances
        run: |
          npm ci
          which pod || brew install cocoapods
          which fastlane || brew install fastlane

      - name: Construire l'app iPhone
        run: npx --yes eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/LeCercle127.ipa"

      - name: Envoyer à App Store Connect (TestFlight)
        run: npx --yes eas-cli@latest submit --platform ios --profile production --path "$RUNNER_TEMP/LeCercle127.ipa" --non-interactive

      - name: Garder le fichier si l'envoi a échoué
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LeCercle127-ipa
          path: ${{ runner.temp }}/LeCercle127.ipa
          if-no-files-found: ignore
          retention-days: 3
